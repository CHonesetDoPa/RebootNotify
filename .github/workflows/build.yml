name: Build Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Ubuntu binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Ubuntu binaries
        run: |
          set -euo pipefail

          mkdir -p dist

          for arch in amd64 arm64; do
            echo "Building linux/${arch}"

            GOOS=linux \
            GOARCH="${arch}" \
            CGO_ENABLED=0 \
            go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "dist/RebootNotify-linux-${arch}" \
              .

            chmod +x "dist/RebootNotify-linux-${arch}"
          done

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum RebootNotify-linux-* > SHA256SUMS

      - name: Verify artifacts
        run: |
          set -euo pipefail

          test -f dist/RebootNotify-linux-amd64
          test -f dist/RebootNotify-linux-arm64
          test -f dist/SHA256SUMS

          file dist/RebootNotify-linux-*

          (
            cd dist
            sha256sum -c SHA256SUMS
          )

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-binaries
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-binaries
          path: dist

      - name: Verify release artifacts
        run: |
          set -euo pipefail

          ls -lh dist

          test -f dist/RebootNotify-linux-amd64
          test -f dist/RebootNotify-linux-arm64
          test -f dist/SHA256SUMS

          (
            cd dist
            sha256sum -c SHA256SUMS
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RebootNotify-linux-amd64
            dist/RebootNotify-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true